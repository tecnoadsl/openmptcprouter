services:
  # --- MQTT Broker ---
  mqtt:
    image: eclipse-mosquitto:2
    container_name: omr-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"  # WebSocket (per dashboard/app)
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    restart: unless-stopped

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: omr-db
    environment:
      POSTGRES_DB: omr_platform
      POSTGRES_USER: omr
      POSTGRES_PASSWORD: omr_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Redis (cache + pub/sub real-time) ---
  redis:
    image: redis:7-alpine
    container_name: omr-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- Cloud API (FastAPI) ---
  api:
    build: ./api
    container_name: omr-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://omr:omr_dev_password@db:5432/omr_platform
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-change-in-production
    depends_on:
      - db
      - mqtt
      - redis
    restart: unless-stopped

  # === UI ORIGINALI ===

  # --- LuCI Reale (Router OpenWrt) ---
  router-luci:
    build: ./router-luci
    container_name: omr-router-luci
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: unless-stopped

  # --- Nginx proxy per LuCI (workaround Docker Desktop Mac) --- porta 8080
  luci-proxy:
    image: nginx:alpine
    container_name: omr-luci-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - router-luci
    restart: unless-stopped

  # --- VPS Admin Reale (FastAPI originale) --- porta 8081
  vps-admin:
    build: ./vps-admin-original
    container_name: omr-vps-admin
    ports:
      - "8081:65500"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # --- Zenarmor NGFW (in prod va sulla VPS bare metal) --- porta 9090
  zenarmor:
    build: ./zenarmor
    container_name: omr-zenarmor
    ports:
      - "9090:9090"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    depends_on:
      - vps
    restart: unless-stopped

  # === NUOVE UI CUSTOM ===

  # --- Dashboard Cloud Centralizzata --- porta 3000
  web:
    build: ./web
    container_name: omr-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:9001
    depends_on:
      - api
    restart: unless-stopped

  # --- Nuova UI Router Custom --- porta 8090
  web-router:
    build: ./web-router
    container_name: omr-web-router
    ports:
      - "8090:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # --- Nuova UI VPS Custom --- porta 8091
  web-vps:
    build: ./web-vps
    container_name: omr-web-vps
    ports:
      - "8091:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # === AGENTI SIMULATI ===

  # --- VPS Simulata (agent MQTT) ---
  vps:
    build: ./vps
    container_name: omr-vps
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      DEVICE_ID: vps-dev-001
      DEVICE_TYPE: vps
      PYTHONUNBUFFERED: 1
    depends_on:
      - mqtt
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # --- Router Simulato (agent MQTT) ---
  router:
    build: ./router
    container_name: omr-router
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      DEVICE_ID: router-dev-001
      DEVICE_TYPE: router
      PYTHONUNBUFFERED: 1
    depends_on:
      - mqtt
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  pg-data:
  mqtt-data:
  mqtt-log:
